services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saml
      POSTGRES_PASSWORD: saml
      POSTGRES_DB: saml
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - saml-postgres-data:/var/lib/postgresql/data
    networks:
      - saml-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saml -d saml"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: "super-secret-poc-signing-key-2026"
      ADMIN_API_KEY: "dev-admin-key-change-me"
      BACKEND_URL: "http://localhost:${BACKEND_PORT:-8080}"
      DUKAN_PRO_FRONTEND_URL: "http://localhost:${DUKAN_PRO_PORT:-3001}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-3000}"
      ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-3000},http://localhost:${DUKAN_PRO_PORT:-3001}"
      DATABASE_URL: "postgres://saml:saml@postgres:5432/saml?sslmode=disable"
      MOCK_TENANT_ID: "dev-tenant.com"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saml-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../saml-frontend-app
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}"
      VITE_FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saml-network

  dukan-pro:
    build:
      context: ../dukan-pro
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}"
        VITE_FRONTEND_URL: "http://localhost:${DUKAN_PRO_PORT:-3001}"
        VITE_SAML_FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-3000}"
        VITE_JWT_SECRET: "super-secret-poc-signing-key-2026"
    ports:
      - "${DUKAN_PRO_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saml-network

networks:
  saml-network:
    driver: bridge

volumes:
  saml-postgres-data:
